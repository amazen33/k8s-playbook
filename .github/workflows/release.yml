name: release

# A pushed v* tag creates a GitHub Release: a pre-release for -alpha/-beta/-rc tags,
# a draft for stable tags (the owner publishes it). A manual run only validates.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to validate against the current main (dry run, creates nothing), e.g. v0.1.0-rc.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      BRANCH_RULE: main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate tag, version, changelog and branch
        id: check
        run: python3 .github/scripts/release_check.py tag "$TAG" --branch "$BRANCH_RULE" --notes "$RUNNER_TEMP/notes.md" --github-output "$GITHUB_OUTPUT"
      - name: Show the release payload
        env:
          PRERELEASE: ${{ steps.check.outputs.prerelease }}
        run: |
          echo "tag=$TAG prerelease=$PRERELEASE event=$GITHUB_EVENT_NAME"
          cat "$RUNNER_TEMP/notes.md"
      - name: Create the GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.check.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            gh release create "$TAG" --verify-tag --prerelease --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" --verify-tag --draft --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
